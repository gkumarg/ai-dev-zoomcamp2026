[project]
name = "chore-manager"
version = "0.1.0"
description = "Household chore manager with an effort-balancing LLM agent — AI Dev Tools Zoomcamp 2026"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<6.0",
]

# No LLM client dependency on purpose: the agent talks to Ollama over plain
# HTTP with the stdlib (chores/agent/runner.py), so there is nothing to
# install and nothing to keep in sync with the server's API version.

[tool.uv]
package = false
